    description: footnote_code appears once; every copy of a duplicate is quarantined.
  - code: LOOKUP_BAD_CODE_FORMAT
    table: bls_pr_footnote
    severity: quarantine
    stage: row
    predicate: >-
      footnote_code RLIKE '^[A-Z]{1,2}$'
    description: footnote_code has the published code format.
  - code: LOOKUP_NULL_TEXT
    table: bls_pr_footnote
