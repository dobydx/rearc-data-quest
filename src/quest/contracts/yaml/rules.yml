  # datausa_population: row rules
  - code: NULL_KEY
    table: datausa_population
    severity: quarantine
    stage: row
    predicate: >-
      nation_id <> '' AND year <> ''
    description: nation_id and year are present.
  - code: BAD_NATION
    table: datausa_population
    severity: quarantine
    stage: row
    predicate: >-
      nation_id = _expected_nation_id
    description: nation_id is the configured nation.
  - code: BAD_YEAR
    table: datausa_population
    severity: quarantine
    stage: row
    predicate: >-
      year RLIKE '^[0-9]{4}$' AND try_cast(year AS INT) BETWEEN 1900 AND _max_year
    description: Year is 4 digits between 1900 and the year the version was fetched.
  - code: NON_NUMERIC_POPULATION
    table: datausa_population
    severity: quarantine
    stage: row
    # The Databricks JSON reader renders a JSON number as Java double text (3.16128839E8);
    # open-source Spark keeps the source text (316128839.0). Both are valid.
    predicate: >-
      population RLIKE '^[0-9]+([.][0-9]+)?([eE][+]?[0-9]+)?$'
    description: Population is a non-negative number, plain or in exponent form.
  - code: NON_INTEGRAL_POPULATION
    table: datausa_population
    severity: quarantine
    stage: row
    # Scale 18 holds every fractional digit a double prints for a population-sized value, so
    # the cast cannot round a fraction away first. silver.population casts through the same type.
    predicate: >-
      try_cast(population AS DECIMAL(38,18)) % 1 = 0
    description: Population is a whole number (DataUSA sends a float such as 316128839.0).
  - code: NON_POSITIVE_POPULATION
    table: datausa_population
    severity: quarantine
    stage: row
    predicate: >-
      try_cast(population AS DECIMAL(15,1)) IS NULL
      OR try_cast(population AS DECIMAL(15,1)) > 0
    description: Population is above zero.
  - code: DUPLICATE_KEY
    table: datausa_population
    severity: quarantine
    stage: row
    predicate: >-
      _key_count = 1
    description: nation_id and year appear once; every copy of a duplicate is quarantined.

  # datausa_population: validate checks
  - code: POP_YEARS_SHRANK
    table: datausa_population
    severity: warn
    stage: validate
    description: The current version has every year the previous one had.
  - code: RECONCILE_BRONZE
    table: datausa_population
    severity: fail
    stage: validate
    description: Bronze rows of the current version equal silver plus quarantine and page.total.
  - code: DUPLICATE_KEY
    table: datausa_population
    severity: fail
    stage: validate
    description: No row was quarantined as a duplicate key.
  - code: QUARANTINE_RATE
