  - code: LOOKUP_BAD_CODE_FORMAT
    table: bls_pr_duration
    severity: quarantine
    stage: row
    predicate: >-
      duration_code IN ('1', '2', '3')
    description: duration_code has the published code format.
  - code: LOOKUP_NULL_TEXT
    table: bls_pr_duration
    severity: quarantine
