    severity: warn
    stage: validate
    description: Warn on any quarantined row; lookups are too small for a rate to mean anything.

  # BLS tab-separated tables: a line with more or fewer fields than the contract (its raw text
  # lands in _rescued_data, the CSV reader's corrupt-record column).
  - code: RESCUED_DATA
    table: bls_pr_observations
    severity: quarantine
    stage: row
    predicate: >-
      _rescued_data IS NULL
    description: The line parsed to exactly the contract's fields, so no raw text was kept in _rescued_data.
  - code: RESCUED_DATA
    table: bls_pr_series
    severity: quarantine
    stage: row
    predicate: >-
      _rescued_data IS NULL
    description: The line parsed to exactly the contract's fields, so no raw text was kept in _rescued_data.
  - code: RESCUED_DATA
    table: bls_pr_measure
    severity: quarantine
    stage: row
    predicate: >-
      _rescued_data IS NULL
    description: The line parsed to exactly the contract's fields, so no raw text was kept in _rescued_data.
  - code: RESCUED_DATA
    table: bls_pr_sector
    severity: quarantine
    stage: row
    predicate: >-
      _rescued_data IS NULL
    description: The line parsed to exactly the contract's fields, so no raw text was kept in _rescued_data.
