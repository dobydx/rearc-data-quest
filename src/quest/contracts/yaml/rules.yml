    description: Warn on any quarantined row, fail above 1% of the table.

  # gold and ops: validate checks
  - code: Q1_INCOMPLETE
    table: population_stats_2013_2018
    severity: warn
    stage: validate
    description: All 6 years 2013 to 2018 are present.
  - code: PARITY_SQL_PYSPARK
    table: population_stats_2013_2018
    severity: fail
    stage: validate
