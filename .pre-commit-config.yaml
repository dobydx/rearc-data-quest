# Fixtures are byte-exact upstream files; hooks must not rewrite them.
exclude: ^tests/fixtures/
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy (src)
        entry: env UV_PROJECT_ENVIRONMENT=data-quest-uv-venv uv run mypy src
        language: system
        pass_filenames: false
        files: ^src/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: detect-private-key
